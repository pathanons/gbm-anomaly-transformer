# One-command suite for the current best-known model family.
# Dry-run first:
#   python run.py --config configs/general/best_model_suite.yaml --dry-run
# Long run:
#   $env:AT_OUTPUT_ROOT="D:/AnomalyTransformerRuns"
#   python run.py --config configs/general/best_model_suite.yaml
pipeline: experiment_suite
model_pipeline: log_return
exp_name: best_nllassoc_suite
exp_name_template: best_nllassoc_w{window_size}_h{n_heads}_l{e_layers}_lr{lr_tag}_ep{epochs}_s{seed}
data_path: datasets/SP500_event_taxonomy_w{window_size}
tickers: all
device: auto
features: all
normalize_batch: false
include_anomalous_train: false
split_method: chronological
batch_size: 32
window_size: 100
step: 1
d_model: 128
d_ff: 256
dropout: 0.1
predictive_distribution: gaussian
association_mode: gaussian_log_return
loss_mode: legacy
patience: 5
dist_weight: 1.0
recon_weight: 0.0
divergence_weight: 0.0
association_weight: 0.1
score_mode: legacy
n_heads_values: 2,4,8
e_layers_values: 2,3,4
lr_values: 0.00005,0.0001,0.0003
epoch_values: 20,40
seed_values: 11,22,42,77,99
mad_k_values: 9,10,11,12,15
score_csv_template: D:/AnomalyTransformerRuns/experiments/{exp_name}/reports/test_scores.csv
mad_out_template: D:/AnomalyTransformerRuns/experiments/{exp_name}/figures/mad_k{k_tag}
