# Threshold sweep config for the windowed SP500 event-taxonomy experiments.
# This file exposes every supported option in scripts/gbm/sweep_validation_thresholds.py.

# Choose exactly one of these sources:
exp_name: sp500_event_taxonomy_w{window_size}_joint
scores_file: null

# Optional label override used in the output filenames.
label: null

# Column names in the scores CSV.
score_column: score
label_column: y_true

# Sweep settings.
window_size: 20,30,40,60
quantiles: all

# Optional output location override.
output_dir: null