# GBM joint pipeline config for S&P 500 event-taxonomy data.
# This file is intentionally flat so it can be read by a small launcher script.

exp_name: sp500_event_taxonomy_w{window_size}_joint
data_path: datasets/SP500_event_taxonomy_w{window_size}
tickers: all
device: cuda
features: all
normalize_batch: false
batch_size: 64
epochs: 20
lr: 0.0001
window_size: 30,40,60
step: 1
seed: 42
d_model: 128
n_heads: 4
e_layers: 3
d_ff: 256
dropout: 0.1
patience: 5
dist_weight: 1.0
recon_weight: 1.0
divergence_weight: 0.25
threshold_quantile: 0.95
visualize: false
show_true_labels: false
full_context: false
top_k: 10
spike_percentile: 0.95