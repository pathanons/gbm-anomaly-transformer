# Fast next-day density baseline for tomorrow's evidence package.
pipeline: log_return
exp_name: phase4_student_t_nextday_nll_w60_fast_ep3_s42
data_path: datasets/SP500_event_taxonomy_w60
window_size: 60
target: next_day_log_return
step: 1
features: log_return_tail_vol
split_method: chronological
purge_gap: 60
batch_size: 64
epochs: 3
patience: 2
lr: 0.0001
d_model: 128
n_heads: 4
e_layers: 3
d_ff: 256
dropout: 0.1
device: auto
predictive_distribution: student_t
association_mode: "none"
loss_mode: legacy
loss_combine_mode: weighted_sum
dist_weight: 1.0
recon_weight: 0.0
divergence_weight: 0.0
association_weight: 0.0
score_mode: nll_only
include_anomalous_train: true
test_label_mode: endpoint_log_return_3std
