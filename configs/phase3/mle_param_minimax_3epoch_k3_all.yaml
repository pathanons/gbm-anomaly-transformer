# MLE-parameter minimax diagnostic run.
# Window size stays at 100; training is intentionally short (3 epochs).
pipeline: log_return
exp_name: mle_param_minimax_w100_h8_l3_d512_lr0p0001_ep3_s42
output_root: D:/AnomalyTransformerRuns
data_path: datasets/SP500_event_taxonomy_w{window_size}
tickers: all
device: cuda
features: all
normalize_batch: false
include_anomalous_train: false
split_method: chronological
purge_gap: null
batch_size: 32
window_size: 100
step: 1
seed: 42
d_model: 512
n_heads: 8
e_layers: 3
d_ff: 2048
dropout: 0.1
predictive_distribution: gaussian
association_mode: mle_learned_gbm
loss_mode: legacy
loss_combine_mode: mle_param_minimax
patience: 5
epochs: 3
lr: 0.0001
dist_weight: 1.0
recon_weight: 0.0
divergence_weight: 0.0
association_weight: 3.0
score_mode: mle_param_softmax_product
quantile_count: 21
tail_weight_gamma: 2.0
tail_weight_power: 2.0
visualize: true
outlier_k: 3.0
score_formula: mle_param_softmax_product
label_names: jump,drop,volatility_shock
price_dir: datasets/SP500
price_z_thr: 3.0
