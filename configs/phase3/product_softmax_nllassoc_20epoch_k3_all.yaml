# 20-epoch all-ticker run using element-wise Softmax(-association discrepancy) * NLL.
# Pipeline: train -> validate -> test -> k=3 MAD visualization.
pipeline: log_return
exp_name: softmax_product_nllassoc_w100_h2_l4_lr0p00005_ep20_s42
output_root: D:/AnomalyTransformerRuns
data_path: datasets/SP500_event_taxonomy_w{window_size}
tickers: all
device: cuda
features: all
normalize_batch: false
include_anomalous_train: false
split_method: chronological
purge_gap: null
batch_size: 32
window_size: 100
step: 1
seed: 42
d_model: 128
n_heads: 2
e_layers: 4
d_ff: 256
dropout: 0.1
predictive_distribution: gaussian
association_mode: gaussian_log_return
loss_mode: legacy
loss_combine_mode: nll_assoc_softmax_product
patience: 5
epochs: 20
lr: 0.00005
dist_weight: 1.0
recon_weight: 0.0
divergence_weight: 0.0
association_weight: 0.1
score_mode: softmax_product
quantile_count: 21
tail_weight_gamma: 2.0
tail_weight_power: 2.0
visualize: true
outlier_k: 3.0
score_formula: softmax_product
label_names: jump,drop,volatility_shock
price_dir: datasets/SP500
price_z_thr: 3.0
