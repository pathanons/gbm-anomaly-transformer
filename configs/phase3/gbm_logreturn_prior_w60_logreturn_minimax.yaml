# GBM log-return likelihood prior on log_return-only windows.
pipeline: log_return
exp_name: gbm_logreturn_prior_w60_logret_h4_l3_d128_lr0p0001_ep20_s42
output_root: D:/AnomalyTransformerRuns
data_path: datasets/SP500_logreturn_volume_w{window_size}
tickers: all
device: auto
features: log_return_only
normalize_batch: false
include_anomalous_train: false
split_method: chronological
purge_gap: null
batch_size: 128
window_size: 60
step: 1
seed: 42
d_model: 128
n_heads: 4
e_layers: 3
d_ff: 512
dropout: 0.1
predictive_distribution: gaussian
association_mode: gbm_log_return_likelihood
loss_mode: legacy
loss_combine_mode: nll_assoc_minimax
patience: 5
epochs: 20
lr: 0.0001
dist_weight: 1.0
recon_weight: 0.0
divergence_weight: 0.0
association_weight: 3.0
score_mode: softmax_product
quantile_count: 21
tail_weight_gamma: 2.0
tail_weight_power: 2.0
label_names: log_return_anomaly,volume_anomaly
price_dir: datasets/SP500_logreturn_volume_w60
